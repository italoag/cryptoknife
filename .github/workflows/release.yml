name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Release dependency audit
    uses: ./.github/workflows/audit.yml
    permissions:
      contents: read

  package:
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Test release target
      run: cargo test --locked --target ${{ matrix.target }}
    - name: Build release
      run: cargo build --locked --release --target ${{ matrix.target }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test release packager
      run: python3 -m unittest discover -s tests -p 'test_package_release.py' -v
    - name: Package and smoke test
      shell: bash
      run: |
        BIN=target/${{ matrix.target }}/release/cryptoknife
        [ -f "$BIN.exe" ] && BIN="$BIN.exe"
        python3 scripts/package_release.py --binary "$BIN" --target ${{ matrix.target }} --output-dir dist --smoke
    - uses: actions/upload-artifact@v4
      with:
        name: cryptoknife-${{ matrix.target }}
        path: dist/
