name: Dependency Audit

on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''
      release_metadata_artifact:
        type: string
        default: ''
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: RustSec, licenses and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        if: inputs.release_metadata_artifact != ''
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'
      - name: Download release metadata
        if: inputs.release_metadata_artifact != ''
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ inputs.release_metadata_artifact }}
          path: .release-metadata
      - name: Apply release metadata
        if: inputs.release_metadata_artifact != ''
        run: python3 .release-metadata/tools/release.py apply --repo . --plan-dir .release-metadata
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache audit tool
        id: audit-tool
        uses: actions/cache@v5.1.0
        with:
          path: ${{ runner.temp }}/cryptoknife-audit-tools
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-deny-0.18.6
      - name: Install cargo-deny
        if: steps.audit-tool.outputs.cache-hit != 'true'
        run: cargo install cargo-deny@0.18.6 --locked --registry crates-io --root "${RUNNER_TEMP}/cryptoknife-audit-tools"
      - name: Audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          "${RUNNER_TEMP}/cryptoknife-audit-tools/bin/cargo-deny" --version
          "${RUNNER_TEMP}/cryptoknife-audit-tools/bin/cargo-deny" --locked check advisories licenses sources 2>&1 | tee audit-results/cargo-deny.log
      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: dependency-audit
          path: audit-results/cargo-deny.log
          if-no-files-found: warn
          retention-days: 14
