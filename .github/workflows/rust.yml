name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14, macos-15-intel]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests
      run: cargo test --locked --verbose
    - name: Format
      if: matrix.os == 'ubuntu-latest'
      run: cargo fmt --all -- --check
    - name: Clippy
      if: matrix.os == 'ubuntu-latest'
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test release packager
      run: python3 -m unittest discover -s tests -p 'test_package_release.py' -v
    - name: Package smoke test
      shell: bash
      run: |
        BIN=target/debug/cryptoknife
        [ -f "$BIN.exe" ] && BIN="$BIN.exe"
        python3 scripts/package_release.py --binary "$BIN" --target "${{ runner.os }}-${{ runner.arch }}" --output-dir dist --smoke

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.85.0
    - name: Check (MSRV)
      run: cargo check --locked --all-targets

  deny:
    name: Dependency audit
    uses: ./.github/workflows/audit.yml
    permissions:
      contents: read
